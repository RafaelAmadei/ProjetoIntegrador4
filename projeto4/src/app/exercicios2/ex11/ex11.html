<div class="card">
  <h3>Exercício 11 - Exibir somente produtos disponíveis</h3>

  <label>
    <input type="checkbox" [(ngModel)]="somenteDisponiveis" />
    Mostrar somente produtos com estoque
  </label>

  <ul>
    <ng-container *ngFor="let produto of produtos">
      <li *ngIf="!somenteDisponiveis || produto.quantidade > 0">
        {{ produto.nome }} (Qtd: {{ produto.quantidade }})
      </li>
    </ng-container>
  </ul>
</div>
